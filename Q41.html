<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q41 - OTP Timer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow text-center" style="width:380px">
    <h4 class="mb-2">OTP Verification</h4>
    <p class="text-muted mb-3">Enter the OTP sent to your number</p>

    <input type="text" class="form-control text-center fs-4 mb-3" maxlength="4" placeholder="- - - -">

    <button class="btn btn-primary w-100 mb-3">Verify OTP</button>

    <div id="timerMsg" class="text-muted">
      Resend OTP in <span id="countdown" class="fw-bold text-danger">30</span>s
    </div>
    <button id="resendBtn" class="btn btn-link d-none" onclick="startTimer()">Resend OTP</button>
  </div>

  <script>
    let timer;

    function startTimer() {
      let sec = 30;
      document.getElementById("resendBtn").classList.add("d-none");
      document.getElementById("timerMsg").classList.remove("d-none");
      document.getElementById("countdown").textContent = sec;

      clearInterval(timer);
      timer = setInterval(() => {
        sec--;
        document.getElementById("countdown").textContent = sec;
        if (sec <= 0) {
          clearInterval(timer);
          document.getElementById("timerMsg").classList.add("d-none");
          document.getElementById("resendBtn").classList.remove("d-none");
        }
      }, 1000);
    }

    startTimer();
  </script>

</body>
</html>

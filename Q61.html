<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q61 - Custom Dropdown</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .custom-dropdown { position: relative; display: inline-block; width: 250px; }
    .dropdown-list {
      display: none;
      position: absolute;
      width: 100%;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      z-index: 10;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .dropdown-list li {
      padding: 10px 15px;
      cursor: pointer;
      list-style: none;
    }
    .dropdown-list li:hover { background: #f0f0f0; }
  </style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow text-center" style="width:380px">
    <h4 class="mb-4">Custom Dropdown Menu</h4>

    <div class="custom-dropdown mx-auto">
      <button class="btn btn-primary w-100 d-flex justify-content-between align-items-center" id="dropBtn">
        <span id="selectedVal">Select a Country</span>
        <span id="arrow">▼</span>
      </button>
      <ul class="dropdown-list" id="dropList">
        
        <li>🇮🇳 India</li>
        <li>🇺🇸 USA</li>
        <li>🇬🇧 UK</li>
        <li>🇦🇪 UAE</li>
      </ul>
    </div>

    <p class="mt-4 text-muted" id="resultMsg">No country selected.</p>
  </div>

  <script>
    const dropBtn  = document.getElementById("dropBtn");
    const dropList = document.getElementById("dropList");
    const arrow    = document.getElementById("arrow");

    // Toggle dropdown
    dropBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      const isOpen = dropList.style.display === "block";
      dropList.style.display = isOpen ? "none" : "block";
      arrow.textContent = isOpen ? "▼" : "▲";
    });

    // Select item
    dropList.addEventListener("click", function (e) {
      if (e.target.tagName === "LI") {
        document.getElementById("selectedVal").textContent = e.target.textContent;
        document.getElementById("resultMsg").textContent = `You selected: ${e.target.textContent}`;
        dropList.style.display = "none";
        arrow.textContent = "▼";
      }
    });

    // Close on outside click
    document.addEventListener("click", function () {
      dropList.style.display = "none";
      arrow.textContent = "▼";
    });
  </script>

</body>
</html>

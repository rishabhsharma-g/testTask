<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Accordion</title>

    <style>
        details {
            width: 400px;
            margin: 10px;
            padding: 10px;
            border: 1px solid black;
        }

        summary {
           cursor:pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>FAQ</h1>

    <details>
        <summary>What is Java?</summary>
        <p>Java is a programming language.</p>
    </details>

    <details>
        <summary>What is HTML?</summary>
        <p>HTML is used to create the structure of a webpage.</p>
    </details>

    <details>
        <summary>What is CSS?</summary>
        <p>CSS is used to style a webpage.</p>
    </details>

</body>
</html>

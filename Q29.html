<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q29 - Collapsible Sidebar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

  <div class="container-fluid">
    <div class="row">

      <div class="col-md-2 bg-success min-vh-100 p-3">
        <button class="btn btn-light w-100 mb-3" type="button"
          data-bs-toggle="collapse" data-bs-target="#sideMenu">
          <i class="bi bi-list me-2"></i>Menu
        </button>

        <div class="collapse show" id="sideMenu">
          <div class="d-grid gap-2">
            <a href="#" class="btn btn-warning text-start"><i class="bi bi-house me-2"></i>Dashboard</a>
            <a href="#" class="btn btn-light text-start"><i class="bi bi-person me-2"></i>Users</a>
            <a href="#" class="btn btn-light text-start"><i class="bi bi-box me-2"></i>Products</a>
            <a href="#" class="btn btn-light text-start"><i class="bi bi-gear me-2"></i>Settings</a>
          </div>
        </div>
      </div>

      <main class="col-md-10 p-4 bg-light">
        <h4 class="fw-bold text-success">Dashboard</h4>
        <p class="text-muted">Welcome to the admin panel.</p>

        <div class="row g-3 mt-2">
          <div class="col-md-4">
            <div class="card p-3 border-success">
              <h6>Total Users</h6><h3 class="fw-bold text-success">1,250</h3>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-3 border-warning">
              <h6>Products</h6><h3 class="fw-bold text-warning">350</h3>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-3 border-danger">
              <h6>Orders</h6><h3 class="fw-bold text-danger">890</h3>
            </div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

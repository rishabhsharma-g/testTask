<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q42 - Password Strength</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow" style="width:400px">
    <h4 class="text-center mb-4">Password Strength Checker</h4>

    <div class="input-group mb-3">
      <input type="password" id="pwd" class="form-control" placeholder="Enter password">
      <button class="btn btn-outline-secondary" id="toggleBtn">Show</button>
    </div>

    <div class="progress mb-2" style="height:10px">
      <div id="bar" class="progress-bar" style="width:0%"></div>
    </div>
    <p id="label" class="text-center fw-bold mb-3"></p>

    <ul class="list-unstyled small" id="ruleList">
      <li id="r1">❌ At least 8 characters</li>
      <li id="r2">❌ Uppercase letter</li>
      <li id="r3">❌ Lowercase letter</li>
      <li id="r4">❌ Number</li>
      <li id="r5">❌ Special character</li>
    </ul>
  </div>

  <script>
    const rules = [
      { id: "r1", test: p => p.length >= 8,           text: "At least 8 characters" },
      { id: "r2", test: p => /[A-Z]/.test(p),         text: "Uppercase letter" },
      { id: "r3", test: p => /[a-z]/.test(p),         text: "Lowercase letter" },
      { id: "r4", test: p => /[0-9]/.test(p),         text: "Number" },
      { id: "r5", test: p => /[^A-Za-z0-9]/.test(p),  text: "Special character" },
    ];

    const levels = [
      { label: "",           color: "",           pct: 0   },
      { label: "Weak",       color: "bg-danger",  pct: 20  },
      { label: "Fair",       color: "bg-warning", pct: 40  },
      { label: "Good",       color: "bg-info",    pct: 60  },
      { label: "Strong",     color: "bg-primary", pct: 80  },
      { label: "Very Strong",color: "bg-success", pct: 100 },
    ];

    document.getElementById("pwd").addEventListener("input", function () {
      const p = this.value;
      let score = 0;
      rules.forEach(r => {
        const pass = r.test(p);
        document.getElementById(r.id).textContent = (pass ? "✅" : "❌") + " " + r.text;
        if (pass) score++;
      });
      const lvl = p.length === 0 ? levels[0] : levels[score];
      const bar = document.getElementById("bar");
      bar.style.width = lvl.pct + "%";
      bar.className = "progress-bar " + lvl.color;
      document.getElementById("label").textContent = lvl.label;
    });

    document.getElementById("toggleBtn").addEventListener("click", function () {
      const input = document.getElementById("pwd");
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      this.textContent = isHidden ? "Hide" : "Show";
    });
  </script>

</body>
</html>

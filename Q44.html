<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q44 - Number Guessing Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow text-center" style="width:380px">
    <h4 class="mb-1">Number Guessing Game</h4>
    <p class="text-muted mb-3">Guess a number between <strong>1 and 100</strong></p>

    <div class="d-flex gap-2 mb-3">
      <input type="number" id="guess" class="form-control text-center" placeholder="Your guess" min="1" max="100">
      <button class="btn btn-primary" onclick="checkGuess()">Guess</button>
    </div>

    <div id="msg" class="alert d-none mb-3"></div>

    <p class="text-muted small">Attempts: <strong id="attempts">0</strong></p>

    <button class="btn btn-outline-secondary btn-sm" onclick="newGame()">🔄 New Game</button>
  </div>

  <script>
    let secret, attempts, gameOver;

    function newGame() {
      secret = Math.floor(Math.random() * 100) + 1;
      attempts = 0; gameOver = false;
      document.getElementById("attempts").textContent = 0;
      document.getElementById("msg").className = "alert d-none";
      document.getElementById("guess").value = "";
      document.getElementById("guess").disabled = false;
    }

    function checkGuess() {
      if (gameOver) return;
      const val = parseInt(document.getElementById("guess").value);
      if (!val || val < 1 || val > 100) return showMsg("Enter a number between 1 and 100.", "warning");

      attempts++;
      document.getElementById("attempts").textContent = attempts;

      if (val === secret) {
        showMsg(`🎉 Correct! The number was ${secret}. You got it in ${attempts} attempt(s)!`, "success");
        gameOver = true;
        document.getElementById("guess").disabled = true;
      } else {
        showMsg(val < secret ? "📈 Too Low! Go higher." : "📉 Too High! Go lower.", val < secret ? "info" : "danger");
      }
      document.getElementById("guess").value = "";
    }

    function showMsg(text, type) {
      const el = document.getElementById("msg");
      el.className = `alert alert-${type}`;
      el.textContent = text;
    }

    document.getElementById("guess").addEventListener("keydown", e => { if (e.key === "Enter") checkGuess(); });

    newGame();
  </script>

</body>
</html>

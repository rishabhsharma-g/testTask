<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q37 - Counter App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow text-center" style="width:300px">
    <h4 class="mb-3">Counter App</h4>
    <h1 class="display-3 fw-bold mb-4" id="count">0</h1>
    <div class="d-flex gap-2 justify-content-center">
      <button class="btn btn-success" onclick="increment()">+ Increment</button>
      <button class="btn btn-danger"  onclick="decrement()">− Decrement</button>
    </div>
    <button class="btn btn-secondary mt-3 w-100" onclick="reset()">Reset</button>
  </div>

  <script>
    let count = 0;

    function increment() { document.getElementById("count").textContent = ++count; }
    function decrement() { document.getElementById("count").textContent = --count; }
    function reset()     { count = 0; document.getElementById("count").textContent = 0; }
  </script>

</body>
</html>

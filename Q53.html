<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q53 - Event Delegation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container">
    <h4 class="mb-3 text-center">Event Delegation - Cards</h4>

    <div class="mb-3 text-center">
      <button class="btn btn-success" id="addCard">+ Add Card</button>
    </div>

    <div id="cardContainer" class="row g-3">
      <div class="col-md-4">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">Card 1</h5>
          <p class="card-text">This is card 1.</p>
          <button class="btn btn-primary btn-sm like-btn">Like</button>
          <button class="btn btn-danger btn-sm delete-btn mt-2">Delete</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">Card 2</h5>
          <p class="card-text">This is card 2.</p>
          <button class="btn btn-primary btn-sm like-btn">Like</button>
          <button class="btn btn-danger btn-sm delete-btn mt-2">Delete</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">Card 3</h5>
          <p class="card-text">This is card 3.</p>
          <button class="btn btn-primary btn-sm like-btn">Like</button>
          <button class="btn btn-danger btn-sm delete-btn mt-2">Delete</button>
        </div>
      </div>
    </div>

    <div class="mt-3 text-center">
      <span class="badge bg-secondary fs-6" id="statusMsg">Click a button on any card</span>
    </div>
  </div>

  <script>
    let cardCount = 3;

    // Event Delegation - single listener on parent
    document.getElementById("cardContainer").addEventListener("click", function (e) {
      const card = e.target.closest(".card");

      if (e.target.classList.contains("like-btn")) {
        const title = card.querySelector(".card-title").textContent;
        e.target.textContent = e.target.textContent === "Like" ? "❤️ Liked" : "Like";
        document.getElementById("statusMsg").textContent = `You liked "${title}"`;
      }

      if (e.target.classList.contains("delete-btn")) {
        const title = card.querySelector(".card-title").textContent;
        card.closest(".col-md-4").remove();
        document.getElementById("statusMsg").textContent = `"${title}" deleted!`;
      }
    });

    // Add new card dynamically
    document.getElementById("addCard").addEventListener("click", function () {
      cardCount++;
      const col = document.createElement("div");
      col.className = "col-md-4";
      col.innerHTML = `
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">Card ${cardCount}</h5>
          <p class="card-text">This is card ${cardCount}.</p>
          <button class="btn btn-primary btn-sm like-btn">Like</button>
          <button class="btn btn-danger btn-sm delete-btn mt-2">Delete</button>
        </div>`;
      document.getElementById("cardContainer").appendChild(col);
      document.getElementById("statusMsg").textContent = `Card ${cardCount} added!`;
    });
  </script>

</body>
</html>

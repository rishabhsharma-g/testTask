<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Filtering</title>
    <link rel="stylesheet" href="Q77.css">
</head>

<body>
    <h1>Product Store</h1> <!-- Filter Buttons -->
    <div class="filters"> <button onclick="filterProducts('all')">All</button> <button
            onclick="filterProducts('electronics')">Electronics</button> <button
            onclick="filterProducts('clothing')">Clothing</button> <button
            onclick="filterProducts('shoes')">Shoes</button> </div> <!-- Products -->
    <div class="products">
        <div class="product electronics">
            <h2>Laptop</h2>
            <p>₹50,000</p>
        </div>
        <div class="product clothing">
            <h2>T-Shirt</h2>
            <p>₹800</p>
        </div>
        <div class="product shoes">
            <h2>Running Shoes</h2>
            <p>₹2,000</p>
        </div>
        <div class="product electronics">
            <h2>Mobile Phone</h2>
            <p>₹20,000</p>
        </div>
        <div class="product clothing">
            <h2>Jeans</h2>
            <p>₹1,500</p>
        </div>
        <div class="product shoes">
            <h2>Sports Shoes</h2>
            <p>₹2,500</p>
        </div>
    </div>
    <script src="Q77.js"></script>
</body>

</html>

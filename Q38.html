<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q38 - Callback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow text-center" style="width:380px">
    <h4 class="mb-3">Callback Function</h4>

    <div id="message" class="alert alert-secondary mb-3">Click the button to load data.</div>

    <button class="btn btn-primary w-100" id="loadBtn" onclick="loadData(showResult)">Load Data</button>
  </div>

  <script>
    function loadData(callback) {
      document.getElementById("message").className = "alert alert-warning mb-3";
      document.getElementById("message").textContent = "⏳ Loading...";
      document.getElementById("loadBtn").disabled = true;

      setTimeout(function () {
        callback();
        document.getElementById("loadBtn").disabled = false;
      }, 2000);
    }

    function showResult() {
      document.getElementById("message").className = "alert alert-success mb-3";
      document.getElementById("message").textContent = "✅ Data Loaded Successfully!";
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q25 - Signup Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card bg-secondary text-white p-4 " style="width:420px">
    <h4 class="text-center text-warning mb-4">Create Account</h4>

    <form>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Enter your name">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control bg-dark text-white border-secondary" placeholder="Enter your email">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control bg-dark text-white border-secondary" placeholder="Enter password">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control bg-dark text-white border-secondary" placeholder="Confirm password">
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox">
        <label class="form-check-label">I agree to the terms and conditions</label>
      </div>
      <button type="submit" class="btn btn-warning w-100">Sign Up</button>
    </form>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q26 - Carousel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators">
      <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://picsum.photos/id/10/1200/500" class="d-block w-100" alt="Slide 1">
        <div class="carousel-caption">
          <h2>Explore Nature</h2>
          <p>Discover the beauty around you.</p>
          <button class="btn btn-warning">Explore</button>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/id/20/1200/500" class="d-block w-100" alt="Slide 2">
        <div class="carousel-caption">
          <h2>New Adventures</h2>
          <p>Start your journey today.</p>
          <button class="btn btn-warning">Start Now</button>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/id/30/1200/500" class="d-block w-100" alt="Slide 3">
        <div class="carousel-caption">
          <h2>Special Deals</h2>
          <p>Get the best offers now.</p>
          <button class="btn btn-warning">View Deals</button>
        </div>
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

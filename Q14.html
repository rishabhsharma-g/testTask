<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Cards</title>
    <link rel="stylesheet" href="Q14.css">
</head>
<body>

    <div class="pricing-container">

        <div class="card">
            <h2>Basic</h2>
            <h3>₹199</h3>
            <p>1 User</p>
            <p>5 GB Storage</p>
            <button>Choose Plan</button>
        </div>

         <div class="card">
            <h2>Standard</h2>
            <h3>₹499</h3>
            <p>5 Users</p>
            <p>50 GB Storage</p>
            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <h3>₹999</h3>
            <p>Unlimited Users</p>
            <p>100 GB Storage</p>
            <button>Choose Plan</button>
        </div>


    </div>
    
</body>
</html>

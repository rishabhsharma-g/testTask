<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q28 - Bootstrap Icons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark p-4">

  <div class="container">
    <h4 class="text-center text-warning mb-4">Bootstrap Icons UI</h4>

    <div class="row g-3">

      <div class="col-md-4">
        <div class="card bg-secondary text-white text-center p-4">
          <i class="bi bi-person-circle fs-1 text-warning"></i>
          <h5 class="mt-3">Profile</h5>
          <p class="small">Manage your profile.</p>
          <button class="btn btn-warning btn-sm"><i class="bi bi-person me-1"></i>View Profile</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card bg-secondary text-white text-center p-4">
          <i class="bi bi-chat-dots fs-1 text-info"></i>
          <h5 class="mt-3">Messages</h5>
          <p class="small">Check your messages.</p>
          <button class="btn btn-info btn-sm"><i class="bi bi-envelope me-1"></i>Messages</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card bg-secondary text-white text-center p-4">
          <i class="bi bi-gear fs-1 text-danger"></i>
          <h5 class="mt-3">Settings</h5>
          <p class="small">Manage your settings.</p>
          <button class="btn btn-danger btn-sm"><i class="bi bi-gear me-1"></i>Settings</button>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card bg-secondary text-white p-3 d-flex flex-row align-items-center gap-3">
          <i class="bi bi-bell fs-2 text-warning"></i>
          <div>
            <h6 class="fw-bold mb-0">Notifications</h6>
            <small>You have 5 new notifications.</small>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card bg-secondary text-white p-3 d-flex flex-row align-items-center gap-3">
          <i class="bi bi-cart3 fs-2 text-info"></i>
          <div>
            <h6 class="fw-bold mb-0">Shopping Cart</h6>
            <small>You have 3 items in cart.</small>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>

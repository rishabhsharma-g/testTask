<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q23 - Pricing Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container">
    <h4 class="text-center mb-4">Pricing Plans</h4>

    <div class="row g-3 justify-content-center">

      <div class="col-md-4">
        <div class="card text-center p-3 h-100 border-success">
          <h5 class="text-success fw-bold">Starter</h5>
          <h2 class="fw-bold my-3">$9<small class="fs-6 text-muted">/mo</small></h2>
          <p class="text-muted">✔ 3 Projects</p>
          <p class="text-muted">✔ 5 GB Storage</p>
          <p class="text-muted">✔ Email Support</p>
          <p class="text-muted">✘ Priority Support</p>
          <button class="btn btn-outline-success w-100 mt-2">Choose Plan</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card text-center p-3 h-100 bg-dark text-white">
          <span class="badge bg-warning text-dark mb-2">Most Popular</span>
          <h5 class="text-warning fw-bold">Pro</h5>
          <h2 class="fw-bold my-3">$29<small class="fs-6 text-muted">/mo</small></h2>
          <p>✔ 20 Projects</p>
          <p>✔ 50 GB Storage</p>
          <p>✔ Email Support</p>
          <p>✔ Priority Support</p>
          <button class="btn btn-warning w-100 mt-2">Choose Plan</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card text-center p-3 h-100 border-success">
          <h5 class="text-success fw-bold">Enterprise</h5>
          <h2 class="fw-bold my-3">$59<small class="fs-6 text-muted">/mo</small></h2>
          <p class="text-muted">✔ Unlimited Projects</p>
          <p class="text-muted">✔ 200 GB Storage</p>
          <p class="text-muted">✔ Email Support</p>
          <p class="text-muted">✔ Priority Support</p>
          <button class="btn btn-outline-success w-100 mt-2">Choose Plan</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>

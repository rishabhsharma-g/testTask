<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q64 - Theme Switcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { transition: background 0.3s, color 0.3s; }

    body.light  { background: #f8f9fa; color: #212529; }
    body.dark   { background: #212529; color: #f8f9fa; }
    body.blue   { background: #cfe2ff; color: #084298; }
    body.green  { background: #d1e7dd; color: #0a3622; }

    .dark .card  { background: #343a40; color: #f8f9fa; border-color: #495057; }
    .blue .card  { background: #9ec5fe; border-color: #084298; }
    .green .card { background: #a3cfbb; border-color: #0a3622; }
  </style>
</head>
<body class="light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow text-center" style="width:420px">
    <h4 class="mb-4">🎨 Theme Switcher</h4>

    <div class="d-flex gap-2 justify-content-center mb-4">
      <button class="btn btn-light border" onclick="setTheme('light')">☀️ Light</button>
      <button class="btn btn-dark"         onclick="setTheme('dark')">🌙 Dark</button>
      <button class="btn btn-primary"      onclick="setTheme('blue')">🔵 Blue</button>
      <button class="btn btn-success"      onclick="setTheme('green')">🟢 Green</button>
    </div>

    <div class="card p-3 mb-3">
      <h5>Sample Card</h5>
      <p class="mb-0">This card changes with the theme.</p>
    </div>

    <p class="mb-0">Current Theme: <strong id="themeName">Light</strong></p>
  </div>

  <script>
    const names = { light: "Light", dark: "Dark", blue: "Blue", green: "Green" };

    function setTheme(theme) {
      document.body.className = theme + " d-flex justify-content-center align-items-center";
      document.getElementById("themeName").textContent = names[theme];
      localStorage.setItem("theme", theme);
    }

    // Load saved theme
    const saved = localStorage.getItem("theme");
    if (saved) setTheme(saved);
  </script>

</body>
</html>

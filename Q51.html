<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q51 - Modal Popup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
      z-index: 999;
    }
    .overlay.show { display: flex; }
  </style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <button class="btn btn-primary" id="openBtn">Open Modal</button>

  <!-- Modal -->
  <div class="overlay" id="overlay">
    <div class="card p-4 shadow text-center" style="width:380px">
      <h5 class="mb-2">👋 Welcome!</h5>
      <p class="text-muted">This is a JavaScript modal popup.</p>
      <button class="btn btn-danger w-100" id="closeBtn">Close</button>
    </div>
  </div>

  <script>
    document.getElementById("openBtn").addEventListener("click", function () {
      document.getElementById("overlay").classList.add("show");
    });

    document.getElementById("closeBtn").addEventListener("click", function () {
      document.getElementById("overlay").classList.remove("show");
    });

    // Close on outside click
    document.getElementById("overlay").addEventListener("click", function (e) {
      if (e.target === this) this.classList.remove("show");
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smooth Navigation</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top">
        <div class="container">

            <a class="navbar-brand" href="#">My Website</a>

            <div>
                <ul class="navbar-nav flex-row gap-3">

                    <li class="nav-item">
                        <a class="nav-link" href="#home">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#services">Services</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>


                </ul>
            </div>

        </div>
    </nav>


    <!-- Home -->
    <section id="home" class="min-vh-100 bg-light d-flex align-items-center">
        <div class="container text-center">
            <h1>Home</h1>
            <p class="lead">Welcome to our website.</p>
        </div>
    </section>


    <!-- Services -->
    <section id="services" class="min-vh-100 py-5">
        <div class="container text-center">
            <h2>Services</h2>
            <p class="mt-3">
                We provide professional services.
            </p>
        </div>
    </section>


    <!-- About -->
    <section id="about" class="min-vh-100 bg-light py-5">
        <div class="container text-center">
            <h2>About Us</h2>
            <p class="mt-3">
                Learn more about our company.
            </p>
        </div>
    </section>


    <!-- Contact -->
    <section id="contact" class="min-vh-100 py-5">
        <div class="container text-center">
            <h2>Contact</h2>
            <p class="mt-3">
                Contact us for more information.
            </p>
        </div>
    </section>

</body>

</html>

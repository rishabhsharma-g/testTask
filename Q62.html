<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q62 - Shopping Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container">
    <h4 class="mb-4 text-center">🛒 Shopping Cart</h4>

    <div class="row g-3">

      <!-- Products -->
      <div class="col-md-7">
        <h5 class="mb-3">Products</h5>
        <div class="row g-3" id="productList">

          <div class="col-6">
            <div class="card p-3 text-center shadow-sm">
              <h6>👟 Shoes</h6>
              <p class="text-muted mb-1">Rs. 2500</p>
              <button class="btn btn-sm btn-primary add-btn" data-name="Shoes" data-price="2500">Add to Cart</button>
            </div>
          </div>

          <div class="col-6">
            <div class="card p-3 text-center shadow-sm">
              <h6>👕 T-Shirt</h6>
              <p class="text-muted mb-1">Rs. 1200</p>
              <button class="btn btn-sm btn-primary add-btn" data-name="T-Shirt" data-price="1200">Add to Cart</button>
            </div>
          </div>

          <div class="col-6">
            <div class="card p-3 text-center shadow-sm">
              <h6>🎒 Bag</h6>
              <p class="text-muted mb-1">Rs. 1800</p>
              <button class="btn btn-sm btn-primary add-btn" data-name="Bag" data-price="1800">Add to Cart</button>
            </div>
          </div>

          <div class="col-6">
            <div class="card p-3 text-center shadow-sm">
              <h6>⌚ Watch</h6>
              <p class="text-muted mb-1">Rs. 3500</p>
              <button class="btn btn-sm btn-primary add-btn" data-name="Watch" data-price="3500">Add to Cart</button>
            </div>
          </div>

        </div>
      </div>

      <!-- Cart -->
      <div class="col-md-5">
        <h5 class="mb-3">Cart <span class="badge bg-danger" id="cartCount">0</span></h5>
        <ul class="list-group mb-3" id="cartList">
          <li class="list-group-item text-muted" id="emptyMsg">Cart is empty.</li>
        </ul>
        <div class="d-flex justify-content-between fw-bold px-1">
          <span>Total:</span>
          <span id="totalPrice">Rs. 0</span>
        </div>
        <button class="btn btn-success w-100 mt-3" id="checkoutBtn" style="display:none">Checkout</button>
      </div>

    </div>
  </div>

  <script>
    let cart = {};

    document.getElementById("productList").addEventListener("click", function (e) {
      if (!e.target.classList.contains("add-btn")) return;
      const name  = e.target.dataset.name;
      const price = parseInt(e.target.dataset.price);

      if (cart[name]) {
        cart[name].qty++;
      } else {
        cart[name] = { price, qty: 1 };
      }
      renderCart();
    });

    document.getElementById("cartList").addEventListener("click", function (e) {
      if (!e.target.classList.contains("remove-btn")) return;
      const name = e.target.dataset.name;
      delete cart[name];
      renderCart();
    });

    function renderCart() {
      const cartList = document.getElementById("cartList");
      const keys = Object.keys(cart);
      let total = 0;

      if (keys.length === 0) {
        cartList.innerHTML = `<li class="list-group-item text-muted">Cart is empty.</li>`;
        document.getElementById("checkoutBtn").style.display = "none";
      } else {
        cartList.innerHTML = keys.map(name => {
          const item = cart[name];
          total += item.price * item.qty;
          return `<li class="list-group-item d-flex justify-content-between align-items-center">
            <span>${name} x${item.qty}</span>
            <span>Rs. ${item.price * item.qty}
              <button class="btn btn-danger btn-sm ms-2 remove-btn" data-name="${name}">✕</button>
            </span>
          </li>`;
        }).join("");
        document.getElementById("checkoutBtn").style.display = "";
      }

      document.getElementById("cartCount").textContent = keys.length;
      document.getElementById("totalPrice").textContent = `Rs. ${total}`;
    }

    document.getElementById("checkoutBtn").addEventListener("click", function () {
      alert("Order placed successfully! 🎉");
      cart = {};
      renderCart();
    });
  </script>

</body>
</html>

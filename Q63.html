<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q63 - Stopwatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow text-center" style="width:380px">
    <h4 class="mb-4">⏱ Stopwatch</h4>

    <h1 class="display-4 fw-bold mb-4" id="display">00:00:00</h1>

    <div class="d-flex gap-2 justify-content-center mb-3">
      <button class="btn btn-success" id="startBtn">Start</button>
      <button class="btn btn-warning" id="pauseBtn" disabled>Pause</button>
      <button class="btn btn-danger"  id="resetBtn" disabled>Reset</button>
      <button class="btn btn-secondary" id="lapBtn" disabled>Lap</button>
    </div>

    <ul class="list-group text-start" id="lapList"></ul>
  </div>

  <script>
    let timer = null, elapsed = 0, lapCount = 0;

    const display  = document.getElementById("display");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const lapBtn   = document.getElementById("lapBtn");
    const lapList  = document.getElementById("lapList");

    function format(ms) {
      const h = String(Math.floor(ms / 3600000)).padStart(2, "0");
      const m = String(Math.floor((ms % 3600000) / 60000)).padStart(2, "0");
      const s = String(Math.floor((ms % 60000) / 1000)).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    startBtn.addEventListener("click", function () {
      const start = Date.now() - elapsed;
      timer = setInterval(() => {
        elapsed = Date.now() - start;
        display.textContent = format(elapsed);
      }, 1000);
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      resetBtn.disabled = false;
      lapBtn.disabled   = false;
    });

    pauseBtn.addEventListener("click", function () {
      clearInterval(timer);
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    });

    resetBtn.addEventListener("click", function () {
      clearInterval(timer);
      elapsed = 0; lapCount = 0;
      display.textContent = "00:00:00";
      lapList.innerHTML = "";
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      resetBtn.disabled = true;
      lapBtn.disabled   = true;
    });

    lapBtn.addEventListener("click", function () {
      lapCount++;
      const li = document.createElement("li");
      li.className = "list-group-item d-flex justify-content-between";
      li.innerHTML = `<span>Lap ${lapCount}</span><span>${format(elapsed)}</span>`;
      lapList.appendChild(li);
    });
  </script>

</body>
</html>

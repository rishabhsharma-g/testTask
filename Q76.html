
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product App</title>
    <link rel="stylesheet" href="Q76.css">
</head>
<body>

    <header>
        <h1>My Product Store</h1>
    </header>

    <main class="products">

        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/250" alt="Laptop">
            <h2>Laptop</h2>
            <p>Powerful laptop for daily work and study.</p>
            <h3>₹45,000</h3>
            <button>Add to Cart</button>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/250" alt="Mobile Phone">
            <h2>Mobile Phone</h2>
            <p>Smartphone with a powerful camera and battery.</p>
            <h3>₹20,000</h3>
            <button>Add to Cart</button>
        </div>

        <!-- Product 3 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/250" alt="Headphones">
            <h2>Headphones</h2>
            <p>Wireless headphones with clear sound quality.</p>
            <h3>₹2,500</h3>
            <button>Add to Cart</button>
        </div>

        <!-- Product 4 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/250" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p>Stylish smartwatch with health tracking features.</p>
            <h3>₹3,500</h3>
            <button>Add to Cart</button>
        </div>

    </main>

</body>
</html>

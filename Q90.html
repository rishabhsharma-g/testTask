<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Q90 - API Data Table</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="text-center mb-4">API Data Table</h2>

        <div class="card shadow-sm p-3">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Users Information</h5>

                <button class="btn btn-primary btn-sm" onclick="loadUsers()">
                    Refresh Data
                </button>
            </div>

            <p id="message" class="text-center"></p>

            <div class="table-responsive">

                <table class="table table-bordered table-striped table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Website</th>
                        </tr>
                    </thead>

                    <tbody id="userTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script>

        const userTable = document.getElementById("userTable");
        const message = document.getElementById("message");

        async function loadUsers() {

            message.textContent = "Loading data...";
            message.className = "text-center text-primary";

            userTable.innerHTML = "";

            try {

                // Fetch data from API
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!response.ok) {
                    throw new Error("Unable to fetch data.");
                }

                // Convert response into JSON
                const users = await response.json();

                // Display users in table
                users.forEach(user => {

                    userTable.innerHTML += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.phone}</td>
                            <td>${user.website}</td>
                        </tr>
                    `;

                });

                message.textContent = "Data loaded successfully!";
                message.className = "text-center text-success";

            } catch (error) {

                message.textContent =
                    "Failed to load data. Please check your internet connection.";

                message.className = "text-center text-danger";

                console.error(error);

            }

        }

        // Load data when page opens
        loadUsers();

    </script>

</body>
</html>

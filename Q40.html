<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q40 - Arrays</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container" style="max-width:600px">
    <h4 class="text-center mb-4">Arrays — map, filter, reduce</h4>

    <!-- map -->
    <div class="card mb-3">
      <div class="card-header bg-primary text-white">map() — Add Grade</div>
      <div class="card-body p-0">
        <table class="table table-bordered text-center mb-0">
          <thead class="table-light"><tr><th>Name</th><th>Marks</th><th>Grade</th></tr></thead>
          <tbody id="mapTable"></tbody>
        </table>
      </div>
    </div>

    <!-- filter -->
    <div class="card mb-3">
      <div class="card-header bg-success text-white">filter() — Marks ≥ 70</div>
      <div class="card-body p-0">
        <table class="table table-bordered text-center mb-0">
          <thead class="table-light"><tr><th>Name</th><th>Marks</th></tr></thead>
          <tbody id="filterTable"></tbody>
        </table>
      </div>
    </div>

    <!-- reduce -->
    <div class="card mb-3">
      <div class="card-header bg-warning text-dark">reduce() — Class Average</div>
      <div class="card-body text-center">
        <h5 id="reduceResult"></h5>
      </div>
    </div>

  </div>

  <script>
    const students = [
      { name: "Ali",    marks: 92 },
      { name: "Sara",   marks: 65 },
      { name: "Usman",  marks: 78 },
      { name: "Ayesha", marks: 55 },
      { name: "Bilal",  marks: 88 },
      { name: "Fatima", marks: 45 },
    ];

    // map - add grade
    document.getElementById("mapTable").innerHTML = students.map(s => {
      const grade = s.marks >= 90 ? "A" : s.marks >= 75 ? "B" : s.marks >= 60 ? "C" : "F";
      return `<tr><td>${s.name}</td><td>${s.marks}</td><td>${grade}</td></tr>`;
    }).join("");

    // filter - marks >= 70
    const passed = students.filter(s => s.marks >= 70);
    document.getElementById("filterTable").innerHTML = passed.map(s =>
      `<tr><td>${s.name}</td><td>${s.marks}</td></tr>`
    ).join("");

    // reduce - average
    const total = students.reduce((sum, s) => sum + s.marks, 0);
    document.getElementById("reduceResult").textContent =
      `Total: ${total} | Students: ${students.length} | Average: ${(total / students.length).toFixed(1)}`;
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q56 - Show/Hide Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow" style="width:380px">
    <h4 class="mb-3 text-center">Show / Hide Password</h4>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <div class="input-group">
        <input type="password" id="password" class="form-control" placeholder="Enter password">
        <button class="btn btn-outline-secondary" id="toggleBtn">Show</button>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <div class="input-group">
        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password">
        <button class="btn btn-outline-secondary" id="toggleBtn2">Show</button>
      </div>
    </div>

    <button class="btn btn-primary w-100">Submit</button>
  </div>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      btn.textContent = isHidden ? "Hide" : "Show";
    }

    document.getElementById("toggleBtn").addEventListener("click", function () {
      togglePassword("password", this);
    });

    document.getElementById("toggleBtn2").addEventListener("click", function () {
      togglePassword("confirmPassword", this);
    });
  </script>

</body>
</html>

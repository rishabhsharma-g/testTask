<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q60 - Star Rating</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .star {
      font-size: 2.5rem;
      cursor: pointer;
      color: #ccc;
      transition: color 0.2s;
    }
    .star.active { color: #ffc107; }
  </style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow text-center" style="width:380px">
    <h4 class="mb-3">Star Rating Component</h4>

    <div id="stars">
      <span class="star" data-val="1">★</span>
      <span class="star" data-val="2">★</span>
      <span class="star" data-val="3">★</span>
      <span class="star" data-val="4">★</span>
      <span class="star" data-val="5">★</span>
    </div>

    <p class="mt-3 text-muted" id="ratingMsg">Click a star to rate</p>
    <button class="btn btn-primary w-100 mt-2" id="submitBtn" style="display:none">Submit Rating</button>
  </div>

  <script>
    const stars = document.querySelectorAll(".star");
    let selected = 0;

    const messages = ["", "Poor 😞", "Fair 😐", "Good 🙂", "Very Good 😊", "Excellent 🤩"];

    stars.forEach(star => {
      // Hover
      star.addEventListener("mouseover", function () {
        highlight(this.dataset.val);
      });

      // Mouse leave - go back to selected
      star.addEventListener("mouseleave", function () {
        highlight(selected);
      });

      // Click
      star.addEventListener("click", function () {
        selected = this.dataset.val;
        highlight(selected);
        document.getElementById("ratingMsg").textContent = `You rated: ${selected}/5 — ${messages[selected]}`;
        document.getElementById("submitBtn").style.display = "";
      });
    });

    function highlight(val) {
      stars.forEach(s => {
        s.classList.toggle("active", s.dataset.val <= val);
      });
    }

    document.getElementById("submitBtn").addEventListener("click", function () {
      alert(`Rating submitted: ${selected}/5 — ${messages[selected]}`);
    });
  </script>

</body>
</html>

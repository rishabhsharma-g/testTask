<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q47 - Word Counter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow" style="width:500px">
    <h4 class="text-center mb-4">Word & Character Counter</h4>

    <textarea id="text" class="form-control mb-4" rows="6" placeholder="Start typing here..."></textarea>

    <div class="row text-center g-3 mb-3">
      <div class="col-6">
        <div class="border rounded p-3">
          <div class="fs-3 fw-bold text-primary" id="chars">0</div>
          <div class="text-muted small">Characters</div>
        </div>
      </div>
      <div class="col-6">
        <div class="border rounded p-3">
          <div class="fs-3 fw-bold text-success" id="words">0</div>
          <div class="text-muted small">Words</div>
        </div>
      </div>
    </div>

    <button class="btn btn-outline-secondary w-100" onclick="document.getElementById('text').value=''; count()">Clear</button>
  </div>

  <script>
    document.getElementById("text").addEventListener("input", count);

    function count() {
      const t = document.getElementById("text").value;
      document.getElementById("chars").textContent = t.replace(/\s/g, "").length;
      document.getElementById("words").textContent = t.trim() ? t.trim().split(/\s+/).length : 0;
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q59 - Image Preview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow text-center" style="width:400px">
    <h4 class="mb-3">Image Preview Before Upload</h4>

    <input type="file" id="fileInput" class="form-control mb-3" accept="image/*">

    <div id="previewBox" style="display:none">
      <img id="previewImg" src="" alt="Preview" class="img-fluid rounded border" style="max-height:250px">
      <p class="mt-2 text-muted" id="fileName"></p>
    </div>

    <div id="placeholder" class="text-muted">No image selected.</div>

    <button class="btn btn-primary mt-3 w-100" id="uploadBtn" style="display:none">Upload</button>
  </div>

  <script>
    document.getElementById("fileInput").addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById("previewImg").src = e.target.result;
        document.getElementById("fileName").textContent = file.name + " (" + (file.size / 1024).toFixed(1) + " KB)";
        document.getElementById("previewBox").style.display = "";
        document.getElementById("placeholder").style.display = "none";
        document.getElementById("uploadBtn").style.display = "";
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("uploadBtn").addEventListener("click", function () {
      alert("Image uploaded successfully!");
    });
  </script>

</body>
</html>

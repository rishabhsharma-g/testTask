<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q46 - Number Sorting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">

  <div class="card p-4 shadow" style="width:460px">
    <h4 class="text-center mb-4">Number Sorting UI</h4>

    <input type="text" id="nums" class="form-control mb-3" placeholder="Enter numbers e.g. 5, 2, 9, 1, 7">

    <div class="d-flex gap-2 mb-4">
      <button class="btn btn-primary flex-fill" onclick="sort('asc')">⬆ Ascending</button>
      <button class="btn btn-danger flex-fill"  onclick="sort('desc')">⬇ Descending</button>
    </div>

    <div id="original" class="mb-2"></div>
    <div id="result"></div>
  </div>

  <script>
    function getNumbers() {
      return document.getElementById("nums").value
        .split(",").map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
    }

    function sort(dir) {
      const nums = getNumbers();
      if (!nums.length) return alert("Please enter numbers.");

      document.getElementById("original").innerHTML =
        `<p class="fw-bold">Original:</p><p>${nums.join(", ")}</p>`;

      const sorted = [...nums].sort((a, b) => dir === "asc" ? a - b : b - a);
      document.getElementById("result").innerHTML =
        `<p class="fw-bold">${dir === "asc" ? "Ascending" : "Descending"}:</p>
         <p class="text-${dir === "asc" ? "primary" : "danger"} fw-bold">${sorted.join(", ")}</p>`;
    }
  </script>

</body>
</html>

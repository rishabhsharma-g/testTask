<!-- Create a blog webpage layout using article and section tags -->

<!DOCTYPE html>
<html>
    <head>
       <title>Student Registration Form</title>
    </head>

    <body>

        <header>
              <H1>Student Registration Form</H1>
        </header>
        <main>
         <form>

            <label for="name">Student Name :</label><br>
            <input type="text" id="name" aria-label="Enter Your Name" placeholder="Enter Your Name"> <br><br>

            <label for="email">Email ID :</label><br>
            <input type="email" id="email" aria-label="Enter Gmail id" placeholder="Enter Gmail id"><br><br>

            <label for="phone">Mobile No. :</label><br>
            <input type="tel" id="phone" aria-label="Enter Mobile Number" placeholder="Enter Mobile Number"> <br><br>

            <label for="course">Course :</label><br>
            <input type="text" id="course" aria-label="Enter your Cource" placeholder="Enter your Cource"> <br><br>


            <label for="password">Password :</label><br>
            <input type="password" id="password" aria-label="Enter your Password" placeholder="Enter your Password"> <br><br>
            <input type="submit" value="Register">

         </form>
         </main>
    </body>

</html>
